[package]
name = "h-at-h-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["atristar3"]
description = "A high-performance Hentai@Home client written in Rust with full protocol support, gallery downloading, and Docker deployment"
license = "MIT OR Apache-2.0"
repository = "https://github.com/atristar3/h-at-h-rs"
homepage = "https://github.com/atristar3/h-at-h-rs"
documentation = "https://github.com/atristar3/h-at-h-rs#readme"
readme = "README.md"
keywords = ["hentai-at-home", "hah", "distributed-cache", "image-server", "cdn"]
categories = ["command-line-utilities", "network-programming", "caching"]
exclude = [
    ".github/",
    "benches/",
    "tests/",
    "*.md",
    "!README.md",
    ".gitignore",
    ".env*",
    "docker-compose*.yml",
    "Dockerfile",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web framework and HTTP
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
hyper = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "cookies", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Crypto and hashing
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"

# Configuration
dotenvy = "0.15"
config = "0.14"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database for tracking cache
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }

# File handling
tempfile = "3.9"
walkdir = "2.4"
notify = "6.1"

# URL parsing
url = "2.5"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Utilities
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"
parking_lot = "0.12"
dashmap = "5.5"
bytes = "1.5"
futures = "0.3"
async-trait = "0.1"
rand = "0.8"
regex = "1.10"

# HTML parsing for gallery scraping
scraper = "0.18"

# Unix-specific utilities (for disk space checks)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["fs"] }

# TUI (Terminal User Interface)
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
criterion = { version = "0.8.0", features = ["html_reports", "async_tokio"] }
tokio-test = "0.4"

[[bench]]
name = "benchmarks"
harness = false